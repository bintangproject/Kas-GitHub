<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Judul Tab Browser -->
    <title>Kas Digital Pesantren</title>
  
    <!-- Open Graph (WhatsApp / Social Media Share) -->
    <meta property="og:title" content="Kas Digital Pesantren">
    <meta property="og:description" content="Sistem Pencatatan Uang Digital">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://i.ibb.co.com/jkgw1msg/Logo-Hitam.jpg">

    <!-- Font Modern (Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Framework & Icon -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <!-- CSS Utama -->
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    
    <!-- Header Navbar -->
    <header class="app-header sticky-top">
      <nav class="navbar navbar-expand-lg py-3">
        <div class="container-fluid px-3 px-md-5">
          <div class="d-flex align-items-center gap-3">
            <div class="logo-wrapper">
              <img src="https://i.ibb.co.com/F9HrznH/Excel.png" alt="Logo Pesantren" class="header-logo">
            </div>
            <div>
              <h1 class="header-title mb-0">Dashboard Keuangan</h1>
              <p class="header-subtitle mb-0">Pondok Pesantren Darul Fawaid Ilmiyah</p>
            </div>
          </div>
          <div class="d-none d-md-flex align-items-center">
            <span class="badge-status-system">
              <span class="pulse-dot"></span>
              Sistem Kas Utama
            </span>
          </div>
        </div>
      </nav>
    </header>

    <main class="container-fluid px-3 px-md-5 my-4">
      <!-- Alert / Notifikasi -->
      <div id="appAlert" class="custom-alert alert mb-4" role="alert"></div>

      <div class="row g-4">
        <!-- Panel Form Input (Kiri di Laptop, Atas di HP) -->
        <div class="col-xl-4 col-lg-5">
          <div class="card card-custom h-100">
            <div class="card-header-custom">
              <div class="icon-circle bg-primary-soft text-primary">
                <i class="fa-solid fa-pen-to-square"></i>
              </div>
              <div>
                <h5 class="card-title-custom">Input Transaksi</h5>
                <p class="card-subtitle-custom">Catat arus kas masuk atau keluar</p>
              </div>
            </div>
            <div class="card-body p-3 p-md-4">
              <form id="formKas">
                <div class="mb-3">
                  <label class="form-label-custom">Jenis Transaksi</label>
                  <select class="form-select custom-input" id="jenis" required>
                    <option value="masuk">🟢 Pemasukan (+)</option>
                    <option value="keluar">🔴 Pengeluaran (-)</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label-custom">Nominal</label>
                  <div class="input-group">
                    <span class="input-group-text custom-prefix">Rp</span>
                    <input type="text" class="form-control custom-input ps-2" id="jumlah" placeholder="0" oninput="formatRupiahInput(this)" required>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label-custom">Rincian Transaksi</label>
                  <textarea class="form-control custom-input" id="rincian" rows="2" placeholder="Contoh: Konsumsi Rapat / SPP Santri" required></textarea>
                </div>

                <div class="mb-3">
                  <label class="form-label-custom">Penanggung Jawab (PJ)</label>
                  <div class="input-group">
                    <span class="input-group-text custom-prefix"><i class="fa-regular fa-user"></i></span>
                    <input type="text" class="form-control custom-input ps-2" id="pj" placeholder="Nama pengurus" required>
                  </div>
                </div>

                <div class="mb-4">
                  <label class="form-label-custom">Keterangan <span class="text-muted fw-normal">(Opsional)</span></label>
                  <input type="text" class="form-control custom-input" id="keterangan" placeholder="Catatan atau referensi tambahan">
                </div>
                
                <button type="button" id="btnSimpan" onclick="submitForm()" class="btn btn-action-primary w-100">
                  <i id="btnIcon" class="fa-regular fa-floppy-disk me-2"></i><span id="btnText">Simpan Transaksi</span>
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- Panel Rekap & Riwayat (Kanan di Laptop, Bawah di HP) -->
        <div class="col-xl-8 col-lg-7">
          
          <!-- Stat Cards -->
          <div class="row g-3 mb-4">
            <div class="col-12 col-sm-4">
              <div class="stat-card stat-masuk">
                <div class="stat-icon icon-masuk">
                  <i class="fa-solid fa-arrow-down-left"></i>
                </div>
                <div class="stat-info">
                  <span class="stat-label">Total Pemasukan</span>
                  <h4 class="stat-value" id="txtMasuk">Rp 0</h4>
                </div>
              </div>
            </div>
            <div class="col-12 col-sm-4">
              <div class="stat-card stat-keluar">
                <div class="stat-icon icon-keluar">
                  <i class="fa-solid fa-arrow-up-right"></i>
                </div>
                <div class="stat-info">
                  <span class="stat-label">Total Pengeluaran</span>
                  <h4 class="stat-value" id="txtKeluar">Rp 0</h4>
                </div>
              </div>
            </div>
            <div class="col-12 col-sm-4">
              <div class="stat-card stat-saldo">
                <div class="stat-icon icon-saldo">
                  <i class="fa-solid fa-wallet"></i>
                </div>
                <div class="stat-info">
                  <span class="stat-label">Saldo Akhir</span>
                  <h4 class="stat-value" id="txtSaldo">Rp 0</h4>
                </div>
              </div>
            </div>
          </div>

          <!-- Tabel Riwayat Transaksi -->
          <div class="card card-custom">
            <div class="card-header-custom flex-wrap gap-3">
              <div class="d-flex align-items-center gap-2">
                <div class="icon-circle bg-secondary-soft text-secondary">
                  <i class="fa-solid fa-clock-rotate-left"></i>
                </div>
                <div>
                  <h5 class="card-title-custom">Riwayat Transaksi</h5>
                  <p class="card-subtitle-custom">Daftar transaksi kas terbaru</p>
                </div>
              </div>
              <div class="search-box ms-auto">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="inputCari" class="form-control custom-search" onkeyup="filterTabel()" placeholder="Cari transaksi...">
              </div>
            </div>
            
            <div class="table-responsive">
              <table class="table align-middle custom-table mb-0">
                <thead>
                  <tr>
                    <th class="col-tanggal">Tanggal</th>
                    <th class="col-rincian">Rincian</th>
                    <th class="col-nominal">Nominal</th>
                    <th class="col-pj">PJ</th>
                    <th class="col-saldo">Saldo</th>
                  </tr>
                </thead>
                <tbody id="tabelRiwayat">
                  <tr>
                    <td colspan="5" class="text-center py-5 text-muted">
                      <div class="spinner-border spinner-border-sm text-emerald me-2" role="status"></div>
                      Memuat data kas...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            
            <div class="card-footer bg-transparent border-top-0 text-center py-3">
              <button id="btnLoadMore" class="btn btn-load-more rounded-pill px-4" onclick="tampilkanLebihBanyak()" style="display:none;">
                Muat Lebih Banyak
              </button>
              <span id="txtInfoData" class="text-muted d-block small mt-2"></span>
            </div>
          </div>

        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
