<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Judul di Tab Browser -->
    <title>Kas Digital Pesantren</title>
  
    <!-- KODE UNTUK TAMPILAN PRANALA/LINK WA (OPEN GRAPH) -->
    <meta property="og:title" content="Kas Digital Pesantren">
    <meta property="og:description" content="Sistem Pencatatan Uang Digital">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://i.ibb.co.com/rfFcng6g/Kas-Digital.png">

    <!-- Memuat CSS dari Framework & Font Eksternal -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Memuat file CSS Terpisah -->
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    
    <!-- Navbar Header -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm mb-4 py-3">
      <div class="container-fluid px-md-5">
        <div class="d-flex align-items-center">
          <img src="https://i.ibb.co.com/rfFcng6g/Kas-Digital.png" alt="Logo Pesantren" class="header-logo me-3">
          <div>
            <h4 class="fw-bold text-success mb-0">Dashboard Keuangan</h4>
            <p class="text-muted small mb-0">Pondok Pesantren Darul Fawaid Ilmiyah</p>
          </div>
        </div>
        <div class="mt-2 mt-lg-0 d-none d-md-block">
          <span class="badge badge-system px-3 py-2 rounded-pill"><i class="fa-regular fa-calendar-check me-2"></i>Sistem Kas Utama</span>
        </div>
      </div>
    </nav>

    <div class="container-fluid px-md-5 mb-5">
      <div id="appAlert" class="custom-alert alert" role="alert"></div>

      <div class="row g-4">
        <!-- Kolom Form Input -->
        <div class="col-xl-4 col-lg-5">
          <div class="card main-card">
            <div class="card-header bg-white border-bottom pt-4 pb-3">
              <h6 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-pen-to-square text-success me-2"></i>Input Transaksi Baru</h6>
            </div>
            <div class="card-body p-4">
              <form id="formKas">
                <div class="mb-3">
                  <label class="form-label form-label-custom">Tanggal Transaksi</label>
                  <input type="date" class="form-control custom-input" id="tanggal" required>
                </div>
                
                <div class="mb-3">
                  <label class="form-label form-label-custom">Jenis Transaksi</label>
                  <select class="form-select custom-input" id="jenis" required>
                    <option value="masuk">Pemasukan (+)</option>
                    <option value="keluar">Pengeluaran (-)</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label form-label-custom">Nominal</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">Rp</span>
                    <input type="text" class="form-control custom-input border-start-0 ps-1" id="jumlah" placeholder="0" oninput="formatRupiahInput(this)" required>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label form-label-custom">Rincian Transaksi</label>
                  <textarea class="form-control custom-input" id="rincian" rows="2" placeholder="Contoh: Pembayaran SPP / Konsumsi Rapat" required></textarea>
                </div>

                <div class="mb-3">
                  <label class="form-label form-label-custom">Penanggung Jawab (PJ)</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-user"></i></span>
                    <input type="text" class="form-control custom-input border-start-0 ps-1" id="pj" placeholder="Nama pengurus" required>
                  </div>
                </div>

                <div class="mb-4">
                  <label class="form-label form-label-custom">Keterangan (Opsional)</label>
                  <input type="text" class="form-control custom-input" id="keterangan" placeholder="Catatan tambahan">
                </div>
                
                <button type="button" id="btnSimpan" onclick="submitForm()" class="btn btn-success w-100 fw-bold py-2 shadow-sm rounded-3">
                  <i id="btnIcon" class="fa-regular fa-floppy-disk me-2"></i><span id="btnText">Simpan Transaksi</span>
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- Kolom Data & Rekap -->
        <div class="col-xl-8 col-lg-7">
          
          <!-- Widget Rekapitulasi -->
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <div class="card card-rekap rekap-masuk p-3">
                <div class="d-flex justify-content-between align-items-center">
                  <div>
                    <span class="text-muted fw-semibold small mb-1 d-block">Pemasukan</span>
                    <h5 class="fw-bold text-success mb-0" id="txtMasuk">Rp 0</h5>
                  </div>
                  <div class="icon-box bg-success bg-opacity-10 text-success">
                    <i class="fa-solid fa-arrow-down"></i>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card card-rekap rekap-keluar p-3">
                <div class="d-flex justify-content-between align-items-center">
                  <div>
                    <span class="text-muted fw-semibold small mb-1 d-block">Pengeluaran</span>
                    <h5 class="fw-bold text-danger mb-0" id="txtKeluar">Rp 0</h5>
                  </div>
                  <div class="icon-box bg-danger bg-opacity-10 text-danger">
                    <i class="fa-solid fa-arrow-up"></i>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card card-rekap rekap-saldo p-3">
                <div class="d-flex justify-content-between align-items-center">
                  <div>
                    <span class="text-muted fw-semibold small mb-1 d-block">Saldo Akhir</span>
                    <h5 class="fw-bold text-primary mb-0" id="txtSaldo">Rp 0</h5>
                  </div>
                  <div class="icon-box bg-primary bg-opacity-10 text-primary">
                    <i class="fa-solid fa-wallet"></i>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Tabel Riwayat -->
          <div class="card main-card overflow-hidden">
            <div class="card-header bg-white border-bottom-0 pt-4 px-4 pb-3">
              <div class="row align-items-center g-3">
                <div class="col-md-5">
                  <h6 class="mb-0 fw-bold text-dark"><i class="fa-solid fa-clock-rotate-left text-muted me-2"></i>Riwayat Terakhir</h6>
                </div>
                <div class="col-md-7">
                  <div class="input-group input-group-sm">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                    <input type="text" id="inputCari" class="form-control bg-light border-start-0" onkeyup="filterTabel()" placeholder="Cari transaksi...">
                  </div>
                </div>
              </div>
            </div>
            
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0" style="font-size: 14px;">
                <thead class="table-light">
                  <tr>
                    <th class="col-tanggal px-4">Tanggal</th>
                    <th class="col-rincian">Rincian</th>
                    <th class="col-nominal">Nominal</th>
                    <th class="col-pj">PJ</th>
                    <th class="col-saldo px-4">Saldo</th>
                  </tr>
                </thead>
                <tbody id="tabelRiwayat">
                  <tr><td colspan="5" class="text-center text-muted py-5"><i class="fa-solid fa-spinner fa-spin me-2"></i>Memuat data...</td></tr>
                </tbody>
              </table>
            </div>
            
            <div class="card-footer text-center bg-white border-top py-3">
              <button id="btnLoadMore" class="btn btn-sm btn-outline-secondary rounded-pill px-4 fw-semibold mb-2" onclick="tampilkanLebihBanyak()" style="display:none;">
                Muat Lebih Banyak
              </button>
              <span id="txtInfoData" class="text-muted d-block small"></span>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Memuat file JavaScript Terpisah -->
    <script src="script.js"></script>
  </body>
</html>
